version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nest_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: santahorse
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: bkxbets
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: